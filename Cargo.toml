[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mark Manning"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# MCP server
rust-mcp-sdk = { version = "0.8", features = ["server", "macros"] }
rust-mcp-schema = "0.8"

# Persistence (local path)
gallifreydb = { path = "../../../gallifreydb", features = ["mcp-server", "embeddings"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "harness"
version.workspace = true
edition.workspace = true

[dependencies]
harness-mcp = { path = "crates/harness-mcp" }
harness-orchestrator = { path = "crates/harness-orchestrator" }
harness-persistence = { path = "crates/harness-persistence" }
harness-tui = { path = "crates/harness-tui" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
